{% extends "base.html" %}

{% block content %}
<div class="card shadow-sm col-md-8 mx-auto">
    <div class="card-body">
        <h2 class="card-title">{{ <question.question_text }}</h2>
            <p class="text-muted">Всего Голосов: {{ total }}</p>
            {% for choice in choices %}
            <div class="d-flex justify-content-between">
                <span>{{ choice.choice_text }} - {{ choice.percent }}%</span>
                <span class="badge text-bg-primaty">{{ choice.votes }}</span>
            </div>
            <div class="progress mb-3">
                <div class="progress-bar" style="width: {{ choice.percent }}%"></div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
