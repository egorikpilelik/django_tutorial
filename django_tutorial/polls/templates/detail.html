{% extends "base.html" %}

{% block content %}
<div class="card shadow-sm col-md-6 mx-auto">
    <div class="card-body">
        <h2 class="card-title mb-3">{{ question.question_text }}</h2>
        {% if error_message %}
        <div class="alern alern-danger">{{ error_message }}</div>
        {% endif %}
        <form action="{% url 'vote' question.id %}"method="post">
            {% csrf_token %}
            {% for choice in question.choice_set.all %}
            <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="choice" id="choice{{ choice.id }}" value="{{ choice.id }}">
                <label class="form-check-label" for="choice{{ choice.id }}">
                    {{ choice.Choice_text }}
                </label>
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-success mt-2">Проголосовать</button>
        </form>
    </div>
</div>
{% endblock %}
